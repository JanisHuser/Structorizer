<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Structorizer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Menu bar -->
  <nav class="menubar">
    <div class="brand"><span class="logo"></span>Structorizer</div>
    <div class="menu">
      <span class="menu-title">Datei</span>
      <div class="menu-items">
        <button data-action="new">Neues Projekt</button>
        <button data-action="open">Projekt/Datei öffnen <kbd>Ctrl+O</kbd></button>
        <button data-action="save">Download <kbd>Ctrl+S</kbd></button>
        <hr>
        <button data-action="code">Code exportieren</button>
        <button data-action="image">Bild erstellen</button>
      </div>
    </div>
    <div class="menu">
      <span class="menu-title">Bearbeiten</span>
      <div class="menu-items">
        <button data-action="undo">Rückgängig <kbd>Ctrl+Z</kbd></button>
        <button data-action="redo">Wiederholen <kbd>Ctrl+Y</kbd></button>
        <hr>
        <button data-action="delete">Element löschen <kbd>Entf</kbd></button>
      </div>
    </div>
    <div class="menu">
      <span class="menu-title">Hilfe</span>
      <div class="menu-items">
        <button data-action="info">Info</button>
      </div>
    </div>
  </nav>

  <!-- Tabs -->
  <div class="tabbar">
    <div id="tabs"></div>
    <button id="addTab" title="Neues Struktogramm">+</button>
  </div>

  <main>
    <aside id="sidebar">
      <div class="side-scroll">
      <div class="palette">
        <h3>Schleifen</h3>
        <div class="tool" draggable="true" data-type="while"><i>↻</i>While-Schleife</div>
        <div class="tool" draggable="true" data-type="dowhile"><i>↺</i>DoWhile-Schleife</div>
        <div class="tool" draggable="true" data-type="for"><i>#</i>For-Schleife</div>
        <h3>Entscheidungen</h3>
        <div class="tool" draggable="true" data-type="if"><i>?</i>If-Abfrage</div>
        <div class="tool" draggable="true" data-type="switch"><i><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M8 6 3 10v4M8 6v8M8 6l5 4v4"/></svg></i>Mehrfachauswahl</div>
        <h3>Weitere Elemente</h3>
        <div class="tool" draggable="true" data-type="instruction"><i>=</i>Anweisung</div>
        <div class="tool" draggable="true" data-type="call"><i>ƒ</i>Funktion</div>
      </div>

      <div id="props" class="props" hidden>
        <h3 id="propTitle">Element</h3>
        <label><span id="propLabel">Text</span> <textarea id="propText" rows="2"></textarea></label>
        <div id="caseProps"></div>
        <button id="deleteBtn" class="danger" disabled>Element löschen</button>
      </div>
      </div>

      <button id="collapseBtn" class="collapse"><span>‹</span> Menu verkleinern</button>
    </aside>

    <section id="canvas">
      <div id="diagram"></div>
    </section>
  </main>

  <!-- Start dialog -->
  <dialog id="startDialog">
    <h4>Neues Projekt erstellen:</h4>
    <input id="newTitle" placeholder="Projekttitel">
    <button id="createBtn" disabled>Projekt erstellen</button>
    <h4>Projekt aus Datei öffnen:</h4>
    <button id="openBtn">Datei auswählen…</button>
    <button id="lastBtn" class="primary">Zuletzt bearbeitetes Projekt laden</button>
  </dialog>

  <!-- Generic info / code dialog -->
  <dialog id="infoDialog" class="info">
    <header><span id="infoTitle">Information</span><button class="close" data-close>×</button></header>
    <div id="infoBody"></div>
  </dialog>

  <!-- Small question dialog (replaces prompt / confirm, which some browsers block) -->
  <dialog id="askDialog">
    <form method="dialog">
      <h4 id="askTitle"></h4>
      <input id="askInput" autocomplete="off">
      <!-- OK comes first so that Enter submits it (shown on the right via row-reverse) -->
      <div class="ask-actions">
        <button value="ok" class="primary" id="askOk">OK</button>
        <button value="cancel" formnovalidate>Abbrechen</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="fileInput" accept=".json,.struct" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
